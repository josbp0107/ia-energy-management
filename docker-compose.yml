services:
  postgres:
    image: postgres:17
    container_name: ia-energy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?missing DB_NAME; use --env-file backend/.env}
      POSTGRES_USER: ${DB_USER:?missing DB_USER; use --env-file backend/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?missing DB_PASSWORD; use --env-file backend/.env}
    ports:
      - "${DB_PORT:-5433}:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  seed:
    build: ./backend
    image: ia-energy-backend
    command: ["./seed", "-if-empty"]
    env_file: backend/.env
    environment: &backend-env
      DB_HOST: postgres 
      DB_PORT: "5432"
      DATA_DIR: /app/data
      GIN_MODE: release
      FRONTEND_ORIGIN: http://localhost:${WEB_PORT:-3000}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    image: ia-energy-backend
    restart: unless-stopped
    env_file: backend/.env
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    image: ia-energy-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
